[project]
name = "zed-theme-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Charlie  Davies", email = "charlieadavies@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "annotated-types>=0.7.0",
    "coloraide>=8.10",
    "cyclopts>=4.22.2",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]

[tool.pyrefly]
preset = 'strict'
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
# pytest puts tests/ on sys.path, so test modules import `support` directly
search-path = ["src", "tests"]

[tool.ruff]
# datamodel-codegen output; regenerated from zed_schema_v0.2.0.json, not hand-edited
extend-exclude = ["src/zed_theme_generator/gen/zed_theme.py"]

[project.scripts]
ztg = "zed_theme_generator.cli:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.71.0",
    "hypothesis>=6.161.5",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
